name: Publish fork snapshot

# Publishes the ai.pipestream:lucene-* snapshot to the ai.pipestream registry on every
# push to the fork integration branch. Tests do not run here; this is a packaging step
# over code that was built and tested on the feature branches.
on:
  push:
    branches:
      - kristian-11.x-features
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # The registry is on the private network: this runs only on the Forgejo instance's
    # self-hosted runners, and skips cleanly on github.com.
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish ai.pipestream:lucene-* snapshot
        env:
          FORGEJO_ACTOR: ${{ github.actor }}
          FORGEJO_TOKEN: ${{ secrets.CICD_TOKEN }}
        run: ./gradlew mavenToForgejo --no-daemon

  publish-central:
    # Maven Central's snapshot repository is reachable from everywhere; publishing there
    # happens on github.com with the org-wide Central Portal credentials.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish ai.pipestream:lucene-* snapshot to Central Snapshots
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew mavenToCentralSnapshots --no-daemon
